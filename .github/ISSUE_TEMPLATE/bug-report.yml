name: Bug report
description: Report reproducible incorrect behavior
title: "[Bug]: "
labels: [bug]
body:
  - type: input
    id: gnuradio-version
    attributes:
      label: GNU Radio version
      placeholder: 3.10.12.0
    validations:
      required: true
  - type: input
    id: gr-bbc-version
    attributes:
      label: gr-bbc version or commit
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Problem
      description: Explain what happened and what you expected.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Include the smallest flowgraph or Python example possible.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      render: shell
