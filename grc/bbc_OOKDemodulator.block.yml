id: bbc_OOKDemodulator
label: OOK Demodulator
category: '[bbc]'

templates:
  imports: import bbc
  make: |-
      bbc.OOKDemodulator(
          carrier_freq=${carrier_freq},
          samp_rate=${samp_rate},
          symbol_rate=${symbol_rate},
          bandwidth=${bandwidth},
          threshold=${threshold},
      )
  callbacks:
  - set_carrier_freq(${ carrier_freq })
  - set_samp_rate(${ samp_rate })
  - set_symbol_rate(${ symbol_rate })
  - set_threshold(${ threshold })

parameters:
-   id: carrier_freq
    label: Carrier Offset (Hz)
    dtype: real
    default: 20e3
-   id: samp_rate
    label: Sample Rate
    dtype: real
    default: 128e3
-   id: symbol_rate
    label: Symbol Rate
    dtype: real
    default: '500'
-   id: bandwidth
    label: Bandwidth (Hz)
    dtype: raw
    default: 'None'
    hide: part
-   id: threshold
    label: Slicer Threshold
    dtype: real
    default: '0.25'
    hide: part
-   id: flag
    label: Flag
    dtype: string
    default: 'flag{n0_sh4r3d_s3cr3t}'
    hide: part

inputs:
-   label: in
    domain: stream
    dtype: complex
    vlen: 1

outputs:
-   label: out
    domain: stream
    dtype: byte
    vlen: 1

asserts:
- ${ samp_rate >= symbol_rate }
- ${ threshold > 0 }

documentation: |-
    Recover packed bytes, MSB first, from an on-off keyed carrier.

    Band-pass around the carrier, magnitude squared, integrate over a symbol,
    slice, and pack. Symbol timing is open loop: the band-pass group delay is
    cancelled internally so the integrator lands on symbol boundaries, but
    there is no timing recovery and no framing, so the byte phase of the output
    depends on where the stream started.

    Bandwidth
        Band-pass width in Hz around the carrier. Leave as None for four times
        the symbol rate.

    Slicer Threshold
        Energy above which a symbol counts as a mark, for a unit-amplitude
        carrier. BBC tolerates added marks but not dropped ones, so this sits
        below the halfway point on purpose. Raise it if the channel has a noise
        floor; a threshold near zero turns noise into a solid wall of marks.

    Flag
        Unused. Carried over so 1.x flow graphs load without edits. The block
        never reads it and nothing downstream does either.

file_format: 1
