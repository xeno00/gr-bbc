id: bbc_OOKModulator
label: OOK Modulator
category: '[bbc]'

templates:
  imports: import bbc
  make: |-
      bbc.OOKModulator(
          carrier_freq=${carrier_freq},
          samp_rate=${samp_rate},
          symbol_rate=${symbol_rate},
      )
  callbacks:
  - set_carrier_freq(${ carrier_freq })
  - set_samp_rate(${ samp_rate })
  - set_symbol_rate(${ symbol_rate })

parameters:
-   id: carrier_freq
    label: Carrier Offset (Hz)
    dtype: real
    default: 20e3
-   id: samp_rate
    label: Sample Rate
    dtype: real
    default: 128e3
-   id: symbol_rate
    label: Symbol Rate
    dtype: real
    default: '500'

inputs:
-   label: in
    domain: stream
    dtype: byte
    vlen: 1

outputs:
-   label: out
    domain: stream
    dtype: complex
    vlen: 1

asserts:
- ${ samp_rate >= symbol_rate }
- ${ abs(carrier_freq) < samp_rate / 2 }

documentation: |-
    Gate a complex carrier with packed bytes, MSB first.

    Carrier Offset is a baseband offset, not an RF frequency: keep its
    magnitude below samp_rate / 2 or it aliases to some other offset. Put the
    real RF frequency on the sink block instead.

file_format: 1
