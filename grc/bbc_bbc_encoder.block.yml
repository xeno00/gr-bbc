id: bbc_bbc_encoder
label: BBC Encoder
category: '[bbc]'

templates:
  imports: import bbc
  make: bbc.bbc_encoder(${message_length}, ${codeword_length}, ${checksum_length})

parameters:
-   id: message_length
    label: Message Length (bytes)
    dtype: int
    default: '128'
-   id: codeword_length
    label: Codeword Length (bytes)
    dtype: int
    default: '131072'
-   id: checksum_length
    label: Checksum (bits)
    dtype: int
    default: '32'

inputs:
-   label: in
    domain: stream
    dtype: byte
    vlen: ${ message_length }

outputs:
-   label: out
    domain: stream
    dtype: byte
    vlen: ${ codeword_length }

asserts:
- ${ message_length > 0 }
- ${ codeword_length > message_length }
- ${ 0 <= checksum_length <= 256 }

documentation: |-
    Encode a fixed-length message into a long, sparse BBC codeword.

    One mark is placed per message bit, at a pseudo-random location derived
    from the message prefix so far. The codeword is far longer than the
    message, so marks stay sparse and the decoder can prune aggressively.

    Because marks are only ever added, several codewords may be OR'd together
    and all of their messages still decode.

    Message Length / Codeword Length
        Sizes in bytes, and the vector lengths of the input and output ports.
        The ratio sets how much jamming the code survives; the 128 B / 128 KiB
        default is a 1024x expansion.

    Checksum
        Extra check bits appended to each message. The decoder forces these
        rather than searching them, so they prune false decodes instead of
        multiplying them. Must match the decoder. Set 0 to disable.

file_format: 1
