id: bbc_bbc_encoder
label: BBC Encoder
category: '[BBC]'

templates:
  imports: from gnuradio import bbc
  make: bbc.bbc_encoder(${message_length}, ${codeword_length})

parameters:
  - id: message_length
    label: Message length (bytes)
    dtype: int
    default: 128
  - id: codeword_length
    label: Codeword length (bytes)
    dtype: int
    default: 131072

inputs:
  - label: in
    domain: stream
    dtype: byte
    vlen: ${message_length}

outputs:
  - label: out
    domain: stream
    dtype: byte
    vlen: ${codeword_length}

documentation: |-
  Encodes each fixed-size message vector using the Baird, Bahn, and Collins
  mark-code algorithm. Lengths are measured in bytes.

file_format: 1
