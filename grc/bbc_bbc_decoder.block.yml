id: bbc_bbc_decoder
label: BBC Decoder
category: '[bbc]'

templates:
  imports: import bbc
  make: |-
      bbc.bbc_decoder(${message_length}, ${codeword_length}, ${checksum_length},
          ${max_candidates}, ${max_steps}, '${checksum_mode}')

parameters:
-   id: message_length
    label: Message Length (bytes)
    dtype: int
    default: '128'
-   id: codeword_length
    label: Codeword Length (bytes)
    dtype: int
    default: '131072'
-   id: checksum_length
    label: Checksum (bits)
    dtype: int
    default: '32'
-   id: checksum_mode
    label: Checksum Mode
    dtype: enum
    default: zeros
    options: [zeros, sha256]
    option_labels: [Zero-fill (interoperable), SHA-256 (local extension)]
    hide: part
-   id: max_candidates
    label: Max Candidates
    dtype: int
    default: '256'
    hide: part
-   id: max_steps
    label: Max Search Steps
    dtype: int
    default: '5000000'
    hide: part

inputs:
-   label: in
    domain: stream
    dtype: byte
    vlen: ${ codeword_length }

outputs:
-   label: out
    domain: stream
    dtype: byte
    vlen: ${ message_length }
-   label: decoded
    domain: message
    optional: true

asserts:
- ${ message_length > 0 }
- ${ codeword_length > message_length }
- ${ 0 <= checksum_length <= 256 }
- ${ max_candidates > 0 }
- ${ max_steps > 0 }

documentation: |-
    Recover every message consistent with a received BBC codeword.

    A codeword can carry more than one message, so this block produces a
    variable number of message vectors per codeword. Each decoded message is
    also published on the 'decoded' message port as a PMT u8vector, which is
    usually the easiest way to reach a Message Debug block.

    Message Length / Codeword Length / Checksum
        Must match the encoder exactly, or nothing decodes.

    Max Candidates / Max Search Steps
        Bound the depth-first search. A codeword saturated with marks makes
        every branch look plausible; without these limits it would wedge the
        flowgraph. Hitting either limit logs a warning, and note that a
        truncated search can miss the real message -- keeping a checksum on is
        the better defence.

    Checksum Mode
        'zeros' appends plain zero bits, as in the published algorithm and
        upstream gr-bbc -- this is the interoperable wire format and the
        default. 'sha256' is a local extension that prunes no better; it exists
        only to read codewords produced by an earlier revision of this fork.
        Must match the other end.

file_format: 1
