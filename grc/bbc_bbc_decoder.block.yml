id: bbc_bbc_decoder
label: BBC Decoder
category: '[BBC]'

templates:
  imports: from gnuradio import bbc
  make: bbc.bbc_decoder(${message_length}, ${codeword_length}, ${max_candidates}, ${max_search_nodes})

parameters:
  - id: message_length
    label: Message length (bytes)
    dtype: int
    default: 128
  - id: codeword_length
    label: Codeword length (bytes)
    dtype: int
    default: 131072
  - id: max_candidates
    label: Maximum candidates
    dtype: int
    default: 64
  - id: max_search_nodes
    label: Maximum search nodes
    dtype: int
    default: 1000000

inputs:
  - label: in
    domain: stream
    dtype: byte
    vlen: ${codeword_length}

outputs:
  - label: out
    domain: stream
    dtype: byte
    vlen: ${message_length}

documentation: |-
  Searches a BBC mark codeword and emits zero or more candidate message
  vectors. Search limits protect the scheduler from malformed dense inputs.

file_format: 1
